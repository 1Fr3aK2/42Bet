server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite puts a content hash in the file names under /assets/,
    # so they can be cached "forever".
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, otherwise after a new build
    # the browser keeps asking for old (now missing) asset files.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The app has no React Router, but this keeps a refresh working
    # on any path: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}