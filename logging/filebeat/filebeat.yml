filebeat.autodiscover:
  providers:
    - type: docker
      labels.dedot: true
      templates:
        - condition:
            or:
              - contains:
                  docker.container.labels.com_docker_compose_project: "42bet"
              - contains:
                  docker.container.labels.com_docker_compose_project: "transcendence"
          config:
            - type: container
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log

filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /var/log/modsecurity/audit.log
    fields:
      log_type: modsec_audit
    fields_under_root: true

output.logstash:
  hosts: ["logstash:5044"]

logging.level: info