SecAction \
  "id:900200,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PATCH PUT DELETE'"

# Allow the base64 avatar (data:image/...;base64,...) in PATCH /users/me.
# A base64 data URL trips several CRS rules (PHP "data:" scheme, XSS and Unix
# command-injection patterns that match random base64 text):
#   934170           PHP injection: data scheme detected
#   941130, 941170   XSS attribute / data: vectors
#   932235, 932236, 932260   Unix command-injection patterns
#   attack-sqli, attack-xss, attack-rce   every SQL-injection, XSS and command-
#                    injection rule: random base64 text keeps matching them
#                    ("==" padding as an SQL operator, "+" read as a space before
#                    "OR" or "SRC", ...), so 1 picture in 5 was refused with 403.
#                    The backend accepts only an image data URL made of base64
#                    characters in this field (users/user-rules.ts), never builds
#                    SQL or runs anything from it, and React shows it in <img>.
# They are disabled ONLY for this one endpoint and method. Every other rule
# still inspects the request, and these rules stay active everywhere else.
SecRule REQUEST_METHOD "@streq PATCH" \
  "id:1000001,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  chain"
  SecRule REQUEST_URI "@rx ^/users/me(/|\?|$)" \
    "t:none,\
    ctl:ruleRemoveTargetById=934170;ARGS:json.avatar,\
    ctl:ruleRemoveTargetById=941130;ARGS:json.avatar,\
    ctl:ruleRemoveTargetById=941170;ARGS:json.avatar,\
    ctl:ruleRemoveTargetById=932235;ARGS:json.avatar,\
    ctl:ruleRemoveTargetById=932236;ARGS:json.avatar,\
    ctl:ruleRemoveTargetById=932260;ARGS:json.avatar,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.avatar,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.avatar,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.avatar"

# Allow PromQL in the two read-only monitoring query endpoints.
# PromQL is a query language, not SQL or shell, but its operators and
# brackets trip many CRS rules: "sum(rate(x[1m])) by (route)" matches
# 942150, 942410 and 932240, "up == 0" matches 942120, "... * 100" matches
# 942370, and Grafana legend templates such as "{{route}}" match the
# AngularJS template-injection rule 941380. Without this, 4 of the 12 Grafana
# panels showed "No data" (403) and common Prometheus queries were refused.
# Since any PromQL operator can trip a different rule, the SQL-injection and
# command-injection groups (tags attack-sqli, attack-rce) are disabled ONLY
# for the PromQL fields of these endpoints (a dashboard panel sends one query,
# array_0; Grafana Explore sends the same query twice, range and instant, so
# array_1 is covered too). XSS and every other rule still inspect those fields,
# Grafana's endpoint also requires a login, and every other field and route
# is still fully inspected.
SecRule REQUEST_METHOD "@streq POST" \
  "id:1000002,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  chain"
  SecRule REQUEST_URI "@beginsWith /grafana/api/ds/query" \
    "t:none,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.queries.array_0.expr,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.queries.array_0.expr,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.queries.array_1.expr,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.queries.array_1.expr,\
    ctl:ruleRemoveTargetById=941380;ARGS:json.queries.array_0.legendFormat"

# Rule 1000003 (Prometheus PromQL exclusion) was removed: /prometheus/ is no
# longer published through nginx (returns 404). Grafana proxies all PromQL
# server-side via /grafana/api/ds/query, which is covered by rule 1000002.

# Allow ordinary sentences in the forum's text fields.
# Posts, comments, reports, moderation notes and the search box hold prose, and
# prose keeps tripping the command-injection rules (a sentence starting with
# "Find", "Sort", "Watch", "Top", "Date"... reads like a Unix command: 932236,
# 932260) and some SQL rules ("Patience > luck", "if (price > yesterday)"):
# 40 of 91 ordinary texts were refused with 403. These fields are only stored,
# searched and shown: the backend runs no shell, Prisma sends them to the
# database as parameters, and React escapes them on display. So the
# command-injection and SQL-injection groups (tags attack-rce, attack-sqli) are
# disabled ONLY for these fields of the /forum routes. XSS and every other rule
# still inspect them, and every other field and route keeps every rule.
SecRule REQUEST_URI "@beginsWith /forum/" \
  "id:1000004,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.title,\
  ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.content,\
  ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.reason,\
  ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.note,\
  ctl:ruleRemoveTargetByTag=attack-rce;ARGS:search,\
  ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.title,\
  ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.content,\
  ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.reason,\
  ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.note,\
  ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:search"

# Rule 942440 (SQL comment sequence) false positive on Kibana's session cookie.
# The 'sid' value is a random Iron token (base64url), which can contain '--'
# by chance. The cookie is set with Path=/kibana, so the exclusion is limited
# to that route. Only the cookie target is excluded; the rule stays active
# for every other cookie, argument and route.
SecRule REQUEST_URI "@rx ^/kibana(/|\?|$)" \
  "id:1000005,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  ctl:ruleRemoveTargetById=942440;REQUEST_COOKIES:sid"

# Allow Grafana's per-user page history in the userstorage API.
# Grafana stores the pages the user visited in the 'history' field of
# /grafana/apis/userstorage.grafana.app/. It is a list of URLs, so it holds
# quotes, '%XX' sequences and characters like '<' or '{' that trip rules for
# SQL injection, command injection, double URL encoding (920230) and two
# generic XSS filters (941330, 941340). The SQL-injection and command-injection
# groups (tags attack-sqli, attack-rce) and those three rule ids are disabled
# ONLY for ARGS:json.spec.data.history on this path. Every other XSS rule
# still inspects that field, and every other field of the endpoint keeps every
# rule.
SecRule REQUEST_URI "@beginsWith /grafana/apis/userstorage.grafana.app/" \
  "id:1000006,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.spec.data.history,\
  ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.spec.data.history,\
  ctl:ruleRemoveTargetById=920230;ARGS:json.spec.data.history,\
  ctl:ruleRemoveTargetById=941330;ARGS:json.spec.data.history,\
  ctl:ruleRemoveTargetById=941340;ARGS:json.spec.data.history"

# Grafana updates that record with PATCH and Content-Type
# application/merge-patch+json (Kubernetes-style API), which rule 920420
# refuses because it is not in the default allowed list. Add it to the
# list ONLY for this path; every other route keeps the default list.
SecRule REQUEST_URI "@beginsWith /grafana/apis/userstorage.grafana.app/" \
  "id:1000007,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |text/xml| |application/xml| |application/soap+xml| |application/json| |application/merge-patch+json|'"

# Grafana (Explore, drilldown apps) keeps its state in the page URL, e.g.
# panes={"tea":{"datasource":...,"queries":[{"refId":"A","expr":"sum(rate(x[1m])) by (job)"}]}}.
# The browser sends that URL as the Referer of every request the page makes
# (JS chunks, CSS, /api/login/ping, /api/ds/query), and PromQL looks like SQL
# injection (942200, 942370, ...) and like command injection (932206, 932240)
# to the CRS, so the whole page returned 403. The SQL-injection and
# command-injection groups (tags attack-sqli, attack-rce) are disabled ONLY for
# the Referer header and ONLY on /grafana/ requests. XSS, LFI and every other
# rule still inspect the Referer, and every other header, argument and route
# keeps every rule.
SecRule REQUEST_URI "@beginsWith /grafana/" \
  "id:1000008,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  ctl:ruleRemoveTargetByTag=attack-sqli;REQUEST_HEADERS:Referer,\
  ctl:ruleRemoveTargetByTag=attack-rce;REQUEST_HEADERS:Referer"

# Same state, sent back as a query argument when the Explore page is reloaded
# (F5). The SQL-injection and command-injection groups (tags attack-sqli,
# attack-rce) are disabled ONLY for the 'panes' argument and ONLY on
# /grafana/explore. XSS and every other rule still inspect it, and every other
# argument and route keeps every rule.
SecRule REQUEST_URI "@rx ^/grafana/explore(/|\?|$)" \
  "id:1000009,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:panes,\
  ctl:ruleRemoveTargetByTag=attack-rce;ARGS:panes"

# Grafana Explore saves every query it runs in the query history
# (POST /grafana/api/query-history), with the PromQL in queries[0].expr. As with
# the query endpoint (rule 1000002), PromQL trips the SQL-injection and
# command-injection rules (932240, 942150, 942410, 942120, 942131). Those two
# groups (tags attack-sqli, attack-rce) are disabled ONLY for the PromQL field of
# this endpoint. XSS and every other rule still inspect it, and every other field
# and route keeps every rule.
SecRule REQUEST_URI "@beginsWith /grafana/api/query-history" \
  "id:1000010,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.queries.array_0.expr,\
  ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.queries.array_0.expr"

# Rule 920230 (multiple URL encoding) false positive on the Kibana login.
# POST /kibana/internal/security/login sends 'currentURL', built by the Kibana
# frontend, e.g. "https://localhost/kibana/login?next=%2Fkibana%2F". The "%2F"
# is a legitimate encoded slash, but 920230 reads it as double encoding (3
# points), leaving the login one small rule away from a 403. Only this rule is
# disabled, ONLY for this field, ONLY on the login path. Every other rule still
# inspects it, and 920230 stays active for every other field and route.
SecRule REQUEST_URI "@beginsWith /kibana/internal/security/login" \
  "id:1000011,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  ctl:ruleRemoveTargetById=920230;ARGS:json.currentURL"

# Allow Kibana internal API traffic and queries (rules 932236, 932240, 942220, 942340, 934190).
# Kibana's internal web client exchanges complex JSON state, dashboard filters,
# URL-in-URL parameters, and internal session structures that match several CRS
# rules:
#   932236, 932240   Unix command-injection patterns in internal JSON queries and tokens
#   942340           SQL injection via libinjection in filter DSLs and search queries
#   942220           Integer overflow detection triggered by large epoch timestamps/offsets
#   934190           SSRF detection (scheme-less localhost/internal hostname in currentURL)
# These five rules are disabled ONLY for requests under /kibana.
# Specific targets on /kibana are also handled separately (rule 1000005 for the
# 'sid' cookie, rule 1000011 for 'currentURL' on the login path). All other
# CRS rules (including XSS 941xxx, RFI, LFI, and scanner detection) remain
# fully active on /kibana, and these five rules remain fully active everywhere else.
SecRule REQUEST_URI "@rx ^/+kibana(/|\?|$)" \
  "id:1000012,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  ctl:ruleRemoveById=932236,\
  ctl:ruleRemoveById=932240,\
  ctl:ruleRemoveById=942220,\
  ctl:ruleRemoveById=942340,\
  ctl:ruleRemoveById=934190"

# Allow Socket.IO traffic (rule 920420).
# Socket.IO clients use WebSocket and HTTP long-polling handshakes whose
# Content-Type or upgrade parameters trip rule 920420
# (Request Content-Type is not allowed by policy).
# Rule 920420 is disabled ONLY for requests whose URI starts with /socket.io/.
# Every other CRS rule continues to inspect Socket.IO traffic, and rule 920420
# remains fully enforced across all other routes.
SecRule REQUEST_URI "@rx ^/+socket\.io(/|\?|$)" \
  "id:1000013,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  ctl:ruleRemoveById=920420"

# Kibana Referer header (SQL-injection group).
# The browser sends the address of the current Kibana page as the Referer of
# every request the page makes (API calls, bundles, images), and that address
# carries the page state (e.g. the Security app's ?sourcerer=... argument), with
# characters that rules 942200 and 942370 read as SQL injection. Only the
# attack-sqli group is removed, ONLY for the Referer header, ONLY under /kibana.
SecRule REQUEST_URI "@rx ^/+kibana(/|\?|$)" \
  "id:1000014,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  ctl:ruleRemoveTargetByTag=attack-sqli;REQUEST_HEADERS:Referer"


# Do not block or score upstream 5xx responses as anomalies.
# Rule 950100 intercepts any 5xx status code in phase 4 (outbound) and raises
# the outbound anomaly score, causing rule 959100 to mask server errors as 403 Forbidden.
# In a modern REST architecture with NestJS, internal exceptions are already sanitized
# into safe JSON without leaking stack traces. Masking 5xx as 403 breaks HTTP semantics,
# misleads client applications and diagnostic tools, and confuses server errors with
# security blocks.
SecRuleRemoveById 950100
